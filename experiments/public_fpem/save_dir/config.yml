
dataset:
  name: LiveBeauty
  type: dataloader.dataset.FaceDataset
  resize_size: [224, 112, 160]
  score_key_list: ['clean_mean_score']
  metric_list: ['srcc', 'plcc', 'krcc', 'mse']
  train:
    images_dir_list:
      - /mnt/liyun/code/Essay/FPEM-release/data/LiveBeauty_public/cropped_faces
    meta_file_list:
      - /mnt/liyun/code/Essay/FPEM-release/data/LiveBeauty_public/train.csv
    batch_size: 16
    workers: 4
    data_balance: false

  test:
    images_dir_list:
      - /mnt/liyun/code/Essay/FPEM-release/data/LiveBeauty_public/cropped_faces
    meta_file_list:
      - /mnt/liyun/code/Essay/FPEM-release/data/LiveBeauty_public/test.csv
    batch_size: 32

trainer:
  gpu_id: 0
  max_epoch: 50
  optimizer:
    type: nets.Optim.PreciseAdjustAdamW
    kwargs:
      lr: 5.0e-6
      weight_decay: 0.001
    groups:
      # write config of the submodule you want to train with different lr or frozen
      # the submodule not mentioned will be trained with default_lr in kwargs
      - name: FACLIP
        trainable: false
      - name: SwinGFVQA_ca
        trainable: false

  lr_scheduler:
    type: CosineAnnealingLR
    kwargs:
      T_max: 5

saver:
  pretrain_model:
    - /mnt/liyun/code/Essay/FPEM-release/experiments/public_swin_ca/save_dir/ckpt_e_48_0.9223.pth
    - /mnt/liyun/code/Essay/FPEM-release/experiments/public_faclip/save_dir/ckpt_e_8_0.9299.pth
  val_epoch: 1
  save_epoch: 1
  display_interval: 100
  summary_interval: 20
  plot_scatter: true

net:
  - name: FPEM
    type: nets.Clips.FPEM
    kwargs:
      {}

loss:
    #type: torch.nn.L1Loss
    type: nets.Loss.FaClipLoss
    kwargs:
      {}